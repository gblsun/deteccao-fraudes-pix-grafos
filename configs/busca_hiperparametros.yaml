# Grades da otimização de hiperparâmetros (scripts/03_modelos/otimizar_hiperparametros.py).
#
# Para cada modelo, os valores testados de cada hiperparâmetro. Todas as combinações
# são testadas, mais a configuração atual de configs/experimento.yaml.
#
# Um hiperparâmetro numérico pode ter limites: {valores: [...], min: ..., max: ..., inteiro: true}.
# Quando o vencedor cai na ponta da lista (o maior ou o menor valor testado), a busca
# acrescenta um valor além da ponta, no mesmo passo multiplicativo (ex.: 20, 40 -> 80),
# sem passar do limite, e testa de novo; repete até o vencedor ficar no meio da lista
# ou até o número máximo de rodadas. Sem limites, a lista é fixa.
#
# Modelos sem entrada (ECOD, FRAUDAR) não têm hiperparâmetro que mude a ordem das
# contas. O `contamination` só muda o rótulo binário, e não a average precision, por
# isso não entra em nenhuma grade.

isolation_forest:
  n_estimators: [100, 300]
  max_samples: {valores: [0.1, 0.25, 0.5, 1.0], min: 0.01, max: 1.0}      # fração das contas por árvore
  max_features: {valores: [0.25, 0.5, 1.0], min: 0.05, max: 1.0}         # fração dos atributos por árvore

dbscan:
  min_samples: {valores: [5, 10, 20, 40], min: 2, max: 400, inteiro: true}

local_outlier_factor:
  n_neighbors: {valores: [10, 20, 50, 100], min: 2, max: 1000, inteiro: true}

one_class_svm:
  gamma: {valores: [0.003, 0.01, 0.03, 0.1, 0.3], min: 0.0001, max: 10}

autoencoder:
  bottleneck: {valores: [0.2, 0.35, 0.5], min: 0.05, max: 0.9}           # fração dos atributos na camada estreita
  alpha: {valores: [0.0001, 0.001, 0.01], min: 0.000001, max: 10}        # regularização L2

knn:
  n_neighbors: {valores: [3, 5, 10, 20, 40], min: 1, max: 1000, inteiro: true}
  method: [mean, largest]

kmeans:
  n_clusters: {valores: [2, 4, 8, 16], min: 2, max: 256, inteiro: true}
  large_fraction: {valores: [0.8, 0.9, 0.95], min: 0.5, max: 0.99}

pca:
  components: [all, major, minor]
  weighted: [true, false]

node2vec_if:
  dimensions: {valores: [16, 32, 64], min: 4, max: 256, inteiro: true}
  window: {valores: [3, 5], min: 1, max: 20, inteiro: true}

random_forest:
  max_depth: [null, 4, 8]                                                # null = sem limite
  min_samples_leaf: {valores: [1, 3, 5], min: 1, max: 100, inteiro: true}
  max_features: [sqrt, 0.5]

gradient_boosting:
  learning_rate: {valores: [0.03, 0.1], min: 0.003, max: 1.0}
  max_leaf_nodes: {valores: [7, 31], min: 2, max: 255, inteiro: true}
  min_samples_leaf: {valores: [5, 20], min: 1, max: 200, inteiro: true}
