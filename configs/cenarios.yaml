# Cenários de dificuldade para scripts/avaliar_cenarios.py.
#
# Cada cenário troca alguns parâmetros da seção `simulacao` de
# configs/experimento.yaml (o resto fica igual). A pergunta é: a vantagem de um
# conjunto de atributos sobrevive quando o gerador deixa de embutir sinais
# "fáceis" por construção? (ver "Limitações conhecidas" em data/README.md)
#
# Os cenários vão do mais fácil ao mais difícil; os do meio desligam um
# atalho de cada vez, para saber qual deles sustentava cada resultado. O
# último testa se os atributos temporais dependem do repasse rápido (~30 min),
# que também é uma hipótese do gerador.

base: {}                        # o gerador como está

sem_horario:
  fraud_hours: comercial        # golpes seguem o perfil horário dos Pix legítimos

sem_idade:
  p_new_fraud_account: 0.0      # contas fraudulentas têm a idade das legítimas

sem_atalhos:                    # os dois atalhos desligados
  fraud_hours: comercial
  p_new_fraud_account: 0.0

sem_valor:                      # sem_atalhos + golpes do tamanho de um Pix comum (e não ~4,5x)
  fraud_hours: comercial
  p_new_fraud_account: 0.0
  fraud_amount_shift: 0.0

com_inativos:                   # + 30% das pessoas quase não usam Pix
  fraud_hours: comercial
  p_new_fraud_account: 0.0
  quiet_fraction: 0.3

realista:                       # + fraudes 3x mais raras (ainda bem acima da taxa real)
  fraud_hours: comercial
  p_new_fraud_account: 0.0
  quiet_fraction: 0.3
  n_rings: 2

coletor_ativo:                  # realista + a coletora esvazia o dinheiro em ~20 Pix de saída
  fraud_hours: comercial        # (reunião de 24/09: mais movimentação no vértice do coletor)
  p_new_fraud_account: 0.0
  quiet_fraction: 0.3
  n_rings: 2
  collector_payouts: 20

repasse_lento:                  # teste de estresse: + laranjas esperam ~6 h antes de repassar
  fraud_hours: comercial
  p_new_fraud_account: 0.0
  quiet_fraction: 0.3
  n_rings: 2
  forward_delay_min: 360

# ---------------------------------------------------------------------------
# Cenários de realismo: partem do `realista` e ligam, um grupo de cada vez, o
# que o gerador ainda simplificava (ver "Limitações conhecidas" em
# data/README.md). O `calibrado` junta tudo e é o cenário principal.
# ---------------------------------------------------------------------------

negativos_dificeis:             # realista + contas legítimas parecidas com fraude
  fraud_hours: comercial
  p_new_fraud_account: 0.0
  quiet_fraction: 0.3
  n_rings: 2
  calendar: semanal             # dia da semana e começo do mês
  employees_per_merchant: 4     # comércios pagam salários (leque de saída)
  supplier_tx_per_week: 1       # e fornecedores
  p_organizer: 0.02             # vaquinhas: juntam de vários contatos e pagam um comércio
  p_fast_forwarder: 0.05        # repassam o salário (aluguel) em poucas horas

quadrilhas_realistas:           # realista + quadrilhas que se escondem melhor
  fraud_hours: comercial
  p_new_fraud_account: 0.0
  quiet_fraction: 0.3
  n_rings: 2
  p_recruited_mule: 0.5         # metade das laranjas são contas com histórico legítimo
  collector_cashout: true       # a coletora saca para uma corretora
  laundering_typologies: [cadeia, espalha_junta, ciclo, bipartido]
  p_contested: 0.6              # 60% dos golpes contestados, com atraso (coluna contestado_em)

calibrado:                      # tudo junto, com os números do BCB (docs/resultados.md, seção 3)
  fraud_hours: comercial
  p_new_fraud_account: 0.0
  quiet_fraction: 0.3
  n_people: 10000               # escala: a taxa de golpes fica ~10x a real (e não ~110x)
  n_merchants: 500
  n_rings: 2
  # valores: média de uma lognormal = exp(mu + sigma^2 / 2), com sigma = 1,1
  p_merchant: 0.49              # BCB: 49% dos Pix de PF vão para empresas
  amount_mu: 4.94               # ticket médio P2P de R$ 257
  merchant_amount_mu: 4.13      # ticket médio P2B de R$ 114
  fraud_amount_shift: 2.57      # golpe médio de R$ 2.277 (~9x o P2P)
  calendar: semanal
  employees_per_merchant: 4
  supplier_tx_per_week: 1
  p_organizer: 0.02
  p_fast_forwarder: 0.05
  p_recruited_mule: 0.5
  collector_cashout: true
  laundering_typologies: [cadeia, espalha_junta, ciclo, bipartido]
  p_contested: 0.6

aleatorio:                      # calibrado + estrutura sorteada a cada semente (reunião de 01/10)
  estrutura_aleatoria: true     # nº de quadrilhas, laranjas, vítimas, intermediários e comércios,
  fraud_hours: comercial        # o que cada coletora faz e quanto os comércios pagam: tudo sorteado
  p_new_fraud_account: 0.0      # (ver draw_structure em src/pixfraud/simulation.py)
  quiet_fraction: 0.3
  n_people: 10000
  n_rings: 2                    # agora é a média (1 + Poisson(1))
  p_merchant: 0.49
  amount_mu: 4.94
  merchant_amount_mu: 4.13
  fraud_amount_shift: 2.57
  calendar: semanal
  p_organizer: 0.02
  p_fast_forwarder: 0.05
  laundering_typologies: [cadeia, espalha_junta, ciclo, bipartido]
  p_contested: 0.6
