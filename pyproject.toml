[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixfraud"
version = "0.1.0"
description = "Detecção de fraudes em transações PIX utilizando teoria dos grafos e machine learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "networkx>=3.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
notebooks = ["jupyterlab>=4", "ipykernel"]
app = ["streamlit>=1.30"]
docs = ["pdoc>=14"]
relatorio = ["pypandoc_binary>=1.13"]
# GNN (pixfraud.gnn): o torch basta para o DOMINANT e a GraphSAGE própria; o
# torch_geometric é usado pela GraphSAGE direcionada (graphsage_scores). Instale antes o
# PyTorch só para CPU, bem menor que o de GPU:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
gnn = ["torch>=2.4", "torch_geometric>=2.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lento: testes que rodam scripts inteiros ou o app (pule com -m \"not lento\")"]
# Avisos internos do PyTorch Geometric no Python 3.14, que não dependem deste código.
filterwarnings = [
    "ignore::DeprecationWarning:torch_geometric.*",
    "ignore:`torch.jit.script` is not supported:FutureWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.ipynb"]  # notebooks são material de estudo e análise, já executados

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# modelo HTML/JS da página e CSVs de exemplo embutidos: linhas longas de propósito
"src/pixfraud/explorer.py" = ["E501"]
"tests/test_external.py" = ["E501"]
