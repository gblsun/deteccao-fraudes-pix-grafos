[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixfraud"
version = "0.1.0"
description = "Detecção de fraudes em transações PIX utilizando teoria dos grafos e machine learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "networkx>=3.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
notebooks = ["jupyterlab>=4", "ipykernel"]
app = ["streamlit>=1.30"]
docs = ["pdoc>=14"]
relatorio = ["pypandoc_binary>=1.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lento: testes que rodam scripts inteiros ou o app (pule com -m \"not lento\")"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.ipynb"]  # notebooks são material de estudo e análise, já executados

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# modelo HTML/JS da página e CSVs de exemplo embutidos: linhas longas de propósito
"src/pixfraud/explorer.py" = ["E501"]
"tests/test_external.py" = ["E501"]
